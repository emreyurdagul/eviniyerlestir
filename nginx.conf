server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/wasm image/svg+xml;

    # Statik varlıklar: uzun cache (vite content-hash kullanır)
    location ~* \.(js|css|wasm|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Sağlık kontrolü endpoint'i
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # SPA fallback — tüm rotaları index.html'e yönlendir
    location / {
        try_files $uri $uri/ /index.html;
    }
}
